<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pier &amp; Parcel – General Store</title>
  <meta name="description" content="Browse live product data from the Fake Store API: clothing, jewelery and electronics.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#">Pier &amp; Parcel</a>
    <input id="search" type="search" placeholder="Search products" aria-label="Search products">
    <button id="cartBtn" class="cart-btn" aria-label="Open cart">Cart <span id="cartCount">0</span></button>
  </header>

  <section class="hero">
    <h1>Everyday things, priced plainly.</h1>
    <p>Live catalogue pulled from the Fake Store API. Filter, sort and fill a cart that remembers you.</p>
  </section>

  <main>
    <div class="controls">
      <div id="filters" class="filters" role="group" aria-label="Categories"></div>
      <label class="sort">Sort
        <select id="sort">
          <option value="default">Featured</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
          <option value="rating">Top rated</option>
        </select>
      </label>
    </div>
    <p id="status" class="status" aria-live="polite">Loading products…</p>
    <div id="grid" class="grid"></div>
  </main>

  <div id="overlay" class="overlay" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Shopping cart" aria-hidden="true">
    <div class="drawer-head"><h2>Your cart</h2><button id="closeCart" aria-label="Close cart">Close</button></div>
    <ul id="cartItems" class="cart-items"></ul>
    <div class="drawer-foot">
      <div class="total"><span>Total</span><strong id="total">$0.00</strong></div>
      <button id="checkout" class="primary">Place demo order</button>
      <button id="clear" class="ghost">Empty cart</button>
    </div>
  </aside>

  <div id="toast" class="toast" role="status"></div>
  <footer class="foot">Demo store. Data from <a href="https://fakestoreapi.com" target="_blank" rel="noopener">fakestoreapi.com</a>. No real payments.</footer>
  <script src="Script.js"></script>
</body>
</html>
